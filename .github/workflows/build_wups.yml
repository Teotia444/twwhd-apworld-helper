name: Build WUPS

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        default: "VERBOSE"
        required: false
        type: string
  workflow_call:
    inputs:
      build_type:
        description: 'Build Type'
        default: "VERBOSE"
        required: false
        type: string

env:
  DEBUG_FLAGS: ""

jobs:
  build-wiiu-plugin:
    name: Build Wii U Plugin
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
          
      - name: Set Debug Flags
        if: inputs.build_type != ''
        run: echo "DEBUG_FLAGS=DEBUG=${{ inputs.build_type }} ${{ env.DEBUG_FLAGS }}" >> $GITHUB_ENV
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build docker container
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          tags: helper
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build WUPS
        working-directory: ${{ github.workspace }}
        run: |
          docker run --rm -v ${PWD}:/project helper make ${{ env.DEBUG_FLAGS }} VERSION="$(git rev-parse --short HEAD)" VERSION_DATE="$(date -u +%Y-%m-%d)"

      - name: Save Artifact
        uses: actions/upload-artifact@v7
        with:
          name: WUPS File
          path: twwhd-apworld-helper.wps
          archive: false